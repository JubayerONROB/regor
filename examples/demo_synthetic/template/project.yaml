schema_version: 1
project:
  name: demo_synthetic
  title: "DEMONSTRATION ONLY: median vs moving-average filtering of synthetic impulsive noise"
  domain: signal_processing
  description: >
    Pipeline demonstration on SYNTHETIC data generated by scripts/generate_data.py.
    Nothing in this project is a scientific finding.
  authors: []
research:
  questions:
    - id: RQ1
      text: "On the synthetic impulsive-noise benchmark, does a median filter give lower RMSE than a moving-average filter of the same window?"
    - id: RQ2
      text: "On the same benchmark, does the median filter's RMSE depend on its window length?"
  hypotheses:
    - id: H1
      rq: RQ1
      statement: "A window-5 median filter has lower RMSE than a window-5 moving average on the synthetic benchmark."
      falsification: "No significant difference after correction, or the moving average has lower RMSE."
      status: proposed
    - id: H2
      rq: RQ2
      statement: "Shrinking the median window from 5 to 3 changes RMSE."
      falsification: "No significant difference after correction."
      status: proposed
statistics:
  alpha: 0.05
  min_replicates: 5
  multiple_comparison: holm
  default_test: auto
execution:
  default_backend: local
  max_concurrent: 1
  approval:
    required_for_backends: [kaggle]
    required_above_estimated_hours: 1.0
    required_for_devices: [gpu]
  kaggle:
    enabled: false
stopping:
  max_iterations: 3
  compute_budget_hours: 1.0
  saturation_window: 2
  require_review_every: 1
manuscript:
  sections: [title, abstract, keywords, introduction, methodology, experimental_setup,
             results, statistical_analysis, discussion, limitations, conclusion,
             declarations, references]
  results_sections: [abstract, results, statistical_analysis, conclusion]
